<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>舟券アカデミア評価ツール</title>
    <script src="/api/runtime-config.js"></script>
    <script type="module" src="/cloud-bootstrap-v3.js?v=20260725-ui3item2"></script>
  </head>
  <body>
    <div id="root"></div>

    <script>
      (() => {
        function removeDuplicateAiLedgerRows() {
          const headings = [...document.querySelectorAll("div")].filter((el) => {
            const text = String(el.textContent || "").trim();
            return el.children.length === 0 && text.startsWith("AI予想の収支（");
          });
          for (const heading of headings) {
            const card = heading.parentElement;
            if (!card) continue;
            const grid = [...card.children].find((el) => {
              const rows = [...el.children];
              return rows.length >= 2 && rows.every((row) => row.children.length >= 3);
            });
            if (!grid) continue;
            const seen = new Set();
            for (const row of [...grid.children]) {
              const label = String(row.firstElementChild?.textContent || "").trim();
              if (!label) continue;
              if (seen.has(label)) row.remove();
              else seen.add(label);
            }
          }
        }
        let timer = null;
        const runSoon = () => {
          clearTimeout(timer);
          timer = setTimeout(removeDuplicateAiLedgerRows, 80);
        };
        window.addEventListener("load", runSoon);
        new MutationObserver(runSoon).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
