name: capture-all-active-races

on:
  workflow_dispatch:
  schedule:
    # JST 07:00-09:00
    - cron: "*/5 22-23 * * *"
    # JST 09:00-翌00:55
    - cron: "*/5 0-15 * * *"

concurrency:
  group: capture-all-active-races
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Capture all active venue races and AI predictions
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CAPTURE_TOKEN: ${{ secrets.CAPTURE_TOKEN }}
          AUTOMATION_AUTH_SESSION_JSON: ${{ secrets.AUTOMATION_AUTH_SESSION_JSON }}
          CAPTURE_CONCURRENCY: "5"
          AI_CAPTURE_CONCURRENCY: "2"
          AI_SAVE_BEFORE_MINUTES: "20"
        run: node pipeline/capture_all_active_races.mjs
