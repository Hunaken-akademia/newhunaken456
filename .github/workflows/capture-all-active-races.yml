name: capture-all-active-races

on:
  workflow_dispatch:
  schedule:
    # JST 07:00-09:00
    - cron: "*/5 22-23 * * *"
    # JST 09:00-翌00:55
    - cron: "*/5 0-15 * * *"

concurrency:
  group: capture-all-active-races
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Capture all active venue races
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CAPTURE_TOKEN: ${{ secrets.CAPTURE_TOKEN }}
          CAPTURE_CONCURRENCY: "5"
        run: node pipeline/capture_all_active_races.mjs
